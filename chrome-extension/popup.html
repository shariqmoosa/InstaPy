<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fee Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f11;
      color: #e8e8ea;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e24;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 15px;
    }
    .logo-text { font-weight: 700; font-size: 15px; color: #fff; }
    #settings-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 18px; padding: 2px 4px; border-radius: 6px; }
    #settings-btn:hover { color: #aaa; }

    /* ── Tabs ── */
    .tabs { display: flex; border-bottom: 1px solid #1e1e24; }
    .tab {
      flex: 1; padding: 9px 4px; background: none; border: none;
      color: #666; font-size: 12px; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.active { color: #fff; border-bottom-color: #7c6fe0; }

    /* ── Chips ── */
    .chip {
      padding: 3px 10px; border: 1px solid #2a2a35; border-radius: 20px;
      background: none; color: #666; font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .chip.active { border-color: #7c6fe0; color: #c0baff; background: #1a1a2e; }

    /* ══════════════ WEEKLY TAB ══════════════ */
    #tab-weekly { display: none; }

    #weekly-empty { padding: 20px 16px; }
    #weekly-empty p { color: #555; font-size: 13px; line-height: 1.6; margin-bottom: 12px; text-align: center; }

    #import-drop {
      border: 2px dashed #2a2a40; border-radius: 12px; padding: 16px 12px;
      text-align: center; cursor: pointer; color: #555; font-size: 13px;
      line-height: 1.7; transition: border-color .15s; margin-bottom: 10px;
    }
    #import-drop:hover, #import-drop.drag-over { border-color: #7c6fe0; color: #aaa; }
    #import-drop strong { display: block; color: #888; margin-bottom: 2px; }

    #import-paste {
      width: 100%; padding: 8px 10px; background: #0f0f11;
      border: 1px solid #2a2a35; border-radius: 8px;
      color: #e8e8ea; font-size: 11px; font-family: monospace;
      resize: vertical; min-height: 72px; outline: none;
    }
    #import-paste:focus { border-color: #7c6fe0; }

    #import-btn {
      display: block; width: 100%; margin-top: 10px; padding: 9px;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #import-btn:hover { opacity: 0.88; }
    #import-error { margin-top: 8px; color: #f08080; font-size: 12px; min-height: 16px; }

    /* Job loaded */
    #weekly-job { display: none; }

    #weekly-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 4px; font-size: 12px;
    }
    #weekly-date { color: #555; }
    #weekly-progress-text { color: #4caf82; font-weight: 600; }

    #progress-track {
      height: 4px; background: #1e1e28; margin: 4px 16px 0;
      border-radius: 2px; overflow: hidden;
    }
    #progress-fill { height: 100%; background: #4caf82; border-radius: 2px; width: 0%; transition: width .4s; }

    #checkout-banner {
      display: none; margin: 10px 16px 0; padding: 8px 12px;
      background: #1a2e22; border: 1px solid #4caf82;
      border-radius: 8px; font-size: 12px; color: #4caf82;
    }
    #checkout-banner b { color: #fff; }

    #ctx-picker { padding: 10px 16px 0; }
    .ctx-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .ctx-label { font-size: 11px; color: #555; width: 62px; flex-shrink: 0; }
    .chip-row { display: flex; gap: 5px; flex-wrap: wrap; }

    #capture-btn {
      display: block; width: calc(100% - 32px); margin: 10px 16px 0;
      padding: 10px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #4caf82, #2e9e6a);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    #capture-btn:disabled { opacity: 0.3; cursor: default; }
    #capture-btn:not(:disabled):hover { opacity: 0.88; }

    #capture-status { min-height: 18px; padding: 5px 16px 0; font-size: 12px; text-align: center; }
    #capture-status.ok  { color: #4caf82; }
    #capture-status.err { color: #f08080; }

    #queue-wrap { padding: 10px 16px 0; }
    .queue-title { font-size: 10px; color: #444; margin-bottom: 6px; letter-spacing: .06em; text-transform: uppercase; }
    #queue-list { max-height: 170px; overflow-y: auto; }
    #queue-list::-webkit-scrollbar { width: 3px; }
    #queue-list::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 2px; }

    .qi { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #151518; font-size: 12px; }
    .qi:last-child { border-bottom: none; }
    .qi-icon { font-size: 11px; width: 16px; text-align: center; flex-shrink: 0; }
    .qi-main { flex: 1; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi-city { font-size: 10px; color: #3a3a45; flex-shrink: 0; }
    .qi.done .qi-main { color: #2e2e3a; }
    .qi.next { background: #13132a; margin: 0 -4px; padding: 5px 4px; border-radius: 6px; }
    .qi.next .qi-main { color: #fff; font-weight: 600; }
    .qi.next .qi-city { color: #555; }

    #weekly-actions {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid #1e1e24; margin-top: 10px;
    }
    .act-btn {
      flex: 1; padding: 7px; border: 1px solid #2a2a35; border-radius: 8px;
      background: none; color: #666; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .act-btn:hover { border-color: #5b8dee; color: #5b8dee; }
    .act-btn.danger:hover { border-color: #e05353; color: #e05353; }

    /* ══════════════ ANALYZE TAB ══════════════ */
    #tab-analyze { display: none; padding-bottom: 16px; }
    #site-label { padding: 10px 16px 4px; font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .basket-row { display: flex; align-items: center; gap: 8px; padding: 6px 16px 2px; }
    .basket-row label { font-size: 11px; color: #555; white-space: nowrap; }
    .bchip { padding: 3px 10px; border: 1px solid #2a2a35; border-radius: 20px; background: none; color: #666; font-size: 12px; cursor: pointer; transition: all .15s; }
    .bchip.active { border-color: #7c6fe0; color: #c0baff; background: #1a1a2e; }

    #no-key { display: none; padding: 20px 16px; text-align: center; color: #888; font-size: 13px; line-height: 1.6; }
    #no-key a { color: #7c6fe0; cursor: pointer; text-decoration: underline; }

    #analyze-btn {
      display: block; width: calc(100% - 32px); margin: 8px 16px 14px;
      padding: 10px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    #analyze-btn:hover { opacity: 0.88; }
    #analyze-btn:disabled { opacity: 0.4; cursor: default; }

    #loading { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 28px 16px; color: #888; font-size: 13px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #2a2a35; border-top-color: #7c6fe0; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-box { display: none; margin: 0 16px 14px; padding: 10px 12px; background: #2a1a1a; border: 1px solid #5a2020; border-radius: 8px; color: #f08080; font-size: 12px; line-height: 1.5; }

    #results { display: none; padding: 0 16px; }
    .store-name { font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 10px; }
    .fee-table { width: 100%; border-collapse: collapse; }
    .fee-table td { padding: 6px 0; border-bottom: 1px solid #1e1e24; }
    .fee-table tr:last-child td { border-bottom: none; }
    .fee-table .label { color: #aaa; }
    .fee-table .amount { text-align: right; font-variant-numeric: tabular-nums; }
    .fee-table .null-amount { text-align: right; color: #2e2e3a; }
    .total-row td { padding-top: 10px !important; font-weight: 700; font-size: 15px; color: #fff !important; border-bottom: none !important; }
    .badge-free { color: #4caf82; }
    .notes { margin-top: 10px; padding: 8px 10px; background: #1a1a22; border-radius: 8px; font-size: 11px; color: #666; line-height: 1.5; }

    #copy-row-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 14px; padding: 9px;
      border: 1px solid #2a3a4a; border-radius: 10px;
      background: #141a22; color: #5b8dee;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    #copy-row-btn:hover { border-color: #5b8dee; background: #1a2232; }
    #copy-row-btn.copied { border-color: #4caf82; color: #4caf82; background: #1a2e22; }

    /* ══════════════ RECORDINGS TAB ══════════════ */
    #tab-record { display: none; padding: 0 16px 16px; }
    .record-hint { padding: 10px 0 6px; font-size: 12px; color: #555; line-height: 1.6; }
    .rec-empty { padding: 12px 0; text-align: center; color: #444; font-size: 13px; }
    .rec-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 8px; background: #17171f; border: 1px solid #1e1e28; border-radius: 10px; }
    .rec-store { font-weight: 600; font-size: 13px; }
    .rec-meta  { font-size: 11px; color: #555; margin-top: 2px; }
    .rec-actions { display: flex; gap: 6px; }
    .rec-btn { padding: 5px 10px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .rec-btn-play   { background: #1e3a2e; color: #4caf82; }
    .rec-btn-delete { background: #2a1a1a; color: #e05353; }
    .rec-btn:hover  { opacity: 0.8; }

    #record-btn {
      display: block; width: 100%; margin: 8px 0 14px; padding: 10px;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, #e05353, #e07a53);
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    #record-btn:hover { opacity: 0.88; }
    #record-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">💸</div>
      <span class="logo-text">Fee Checker</span>
    </div>
    <button id="settings-btn" title="Settings">⚙️</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="weekly">Weekly</button>
    <button class="tab" data-tab="analyze">Analyze</button>
    <button class="tab" data-tab="record">Recordings</button>
  </div>

  <!-- ══ WEEKLY TAB ══ -->
  <div id="tab-weekly">

    <!-- No job loaded -->
    <div id="weekly-empty">
      <p>Import your weekly input CSV to start.<br/>Paste from Excel or drop a file.</p>

      <div id="import-drop">
        <strong>📂 Drop CSV / TSV file here</strong>
        or paste below
        <input type="file" id="import-file" accept=".csv,.tsv,.txt" style="display:none">
      </div>

      <textarea id="import-paste"
        placeholder="Paste your two-section input here (retailers section then addresses section, separated by a blank line)…"></textarea>
      <button id="import-btn">Load Job</button>
      <div id="import-error"></div>
    </div>

    <!-- Job loaded -->
    <div id="weekly-job">
      <div id="weekly-header">
        <span id="weekly-date"></span>
        <span id="weekly-progress-text"></span>
      </div>
      <div id="progress-track"><div id="progress-fill"></div></div>

      <div id="checkout-banner">
        ✅ Checkout: <b id="checkout-platform"></b>
        <span id="checkout-retailer" style="color:#aaa; font-weight:400"></span>
      </div>

      <div id="ctx-picker">
        <div class="ctx-row">
          <span class="ctx-label">Basket</span>
          <div class="chip-row" id="basket-chips">
            <button class="chip" data-size="10">$10</button>
            <button class="chip" data-size="25">$25</button>
            <button class="chip" data-size="50">$50</button>
            <button class="chip" data-size="75">$75</button>
            <button class="chip" data-size="100">$100</button>
          </div>
        </div>
        <div class="ctx-row">
          <span class="ctx-label">Membership</span>
          <div class="chip-row" id="mem-chips">
            <button class="chip active" data-mem="Member">Member</button>
            <button class="chip" data-mem="Non-Member">Non-Member</button>
          </div>
        </div>
      </div>

      <button id="capture-btn" disabled>📸 Capture Checkout</button>
      <div id="capture-status"></div>

      <div id="queue-wrap">
        <div class="queue-title">Queue</div>
        <div id="queue-list"></div>
      </div>

      <div id="weekly-actions">
        <button class="act-btn" id="export-btn">📤 Export CSV</button>
        <button class="act-btn" id="reimport-btn">📥 New CSV</button>
        <button class="act-btn danger" id="clear-job-btn">🗑 Clear</button>
      </div>
    </div>

  </div><!-- /tab-weekly -->

  <!-- ══ ANALYZE TAB ══ -->
  <div id="tab-analyze">
    <div id="site-label">Loading…</div>
    <div id="no-key">Add your API key in Settings.<br/><a id="open-settings">Open Settings →</a></div>

    <div class="basket-row">
      <label>Basket:</label>
      <div id="analyze-basket-chips">
        <button class="bchip" data-size="10">$10</button>
        <button class="bchip" data-size="25">$25</button>
        <button class="bchip" data-size="50">$50</button>
        <button class="bchip" data-size="75">$75</button>
        <button class="bchip" data-size="100">$100</button>
      </div>
    </div>

    <button id="analyze-btn">Analyze Fees</button>
    <div id="loading"><div class="spinner"></div><span id="loading-msg">Analyzing…</span></div>
    <div id="error-box"></div>

    <div id="results">
      <div class="store-name" id="store-name"></div>
      <table class="fee-table" id="fee-table"></table>
      <div class="notes" id="notes" style="display:none"></div>
      <button id="copy-row-btn">📋 Copy row for Excel</button>
    </div>
  </div>

  <!-- ══ RECORDINGS TAB ══ -->
  <div id="tab-record">
    <div class="record-hint">Train once per store — it auto-navigates to checkout next time.</div>
    <button id="record-btn">🔴 Start Recording</button>
    <div id="recordings-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
