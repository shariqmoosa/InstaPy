<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fee Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f11;
      color: #e8e8ea;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e24;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .logo-text { font-weight: 700; font-size: 15px; color: #fff; }
    #settings-btn {
      background: none; border: none; cursor: pointer;
      color: #666; font-size: 18px; padding: 2px 4px;
      border-radius: 6px;
    }
    #settings-btn:hover { color: #aaa; }

    /* ── Tabs ── */
    .tabs {
      display: flex; border-bottom: 1px solid #1e1e24;
    }
    .tab {
      flex: 1; padding: 10px; background: none; border: none;
      color: #666; font-size: 13px; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.active { color: #fff; border-bottom-color: #7c6fe0; }

    /* ── Shared ── */
    #site-label {
      padding: 10px 16px 6px; font-size: 12px; color: #666;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .primary-btn {
      display: block; width: calc(100% - 32px);
      margin: 6px 16px 14px;
      padding: 10px; border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .primary-btn:hover { opacity: 0.88; }
    .primary-btn:disabled { opacity: 0.45; cursor: default; }
    .btn-analyze  { background: linear-gradient(135deg, #7c6fe0, #5b8dee); }
    .btn-record   { background: linear-gradient(135deg, #e05353, #e07a53); }
    .btn-replay   { background: linear-gradient(135deg, #53a0e0, #53e09a); }

    #loading {
      display: none; flex-direction: column; align-items: center;
      gap: 10px; padding: 28px 16px; color: #888; font-size: 13px;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #2a2a35;
      border-top-color: #7c6fe0; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #no-key { display: none; padding: 20px 16px; text-align: center; color: #888; font-size: 13px; line-height: 1.6; }
    #no-key a { color: #7c6fe0; cursor: pointer; text-decoration: underline; }
    #error-box { display: none; margin: 0 16px 14px; padding: 10px 12px; background: #2a1a1a; border: 1px solid #5a2020; border-radius: 8px; color: #f08080; font-size: 12px; line-height: 1.5; }

    /* ── Results ── */
    #results { display: none; padding: 0 16px 16px; }
    .store-name { font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 10px; }
    .fee-table { width: 100%; border-collapse: collapse; }
    .fee-table tr td { padding: 6px 0; border-bottom: 1px solid #1e1e24; }
    .fee-table tr:last-child td { border-bottom: none; }
    .fee-table .label { color: #aaa; }
    .fee-table .amount { text-align: right; color: #e8e8ea; font-variant-numeric: tabular-nums; }
    .fee-table .null-amount { text-align: right; color: #3a3a45; }
    .total-row td { padding-top: 10px !important; font-weight: 700; font-size: 15px; color: #fff !important; border-bottom: none !important; }
    .notes { margin-top: 12px; padding: 8px 10px; background: #1a1a22; border-radius: 8px; font-size: 11px; color: #666; line-height: 1.5; }
    .badge-free { color: #4caf82; }

    /* ── Recordings tab ── */
    #tab-record { display: none; padding: 0 16px 16px; }
    .rec-empty { padding: 20px 0; text-align: center; color: #555; font-size: 13px; }
    .rec-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; margin-bottom: 8px;
      background: #17171f; border: 1px solid #1e1e28; border-radius: 10px;
    }
    .rec-store { font-weight: 600; font-size: 13px; }
    .rec-meta  { font-size: 11px; color: #555; margin-top: 2px; }
    .rec-actions { display: flex; gap: 6px; }
    .rec-btn {
      padding: 5px 10px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .rec-btn-play   { background: #1e3a2e; color: #4caf82; }
    .rec-btn-delete { background: #2a1a1a; color: #e05353; }
    .rec-btn:hover  { opacity: 0.8; }

    .record-hint {
      padding: 10px 0 6px; font-size: 12px; color: #555; line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">💸</div>
      <span class="logo-text">Fee Checker</span>
    </div>
    <button id="settings-btn" title="Settings">⚙️</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="analyze">Analyze</button>
    <button class="tab" data-tab="record">Recordings</button>
  </div>

  <!-- ── Analyze tab ── -->
  <div id="tab-analyze">
    <div id="site-label">Loading…</div>
    <div id="no-key">Add your API key in Settings.<br/><a id="open-settings">Open Settings →</a></div>
    <button id="analyze-btn" class="primary-btn btn-analyze">Analyze Fees</button>
    <div id="loading"><div class="spinner"></div><span id="loading-msg">Analyzing fees…</span></div>
    <div id="error-box"></div>
    <div id="results">
      <div class="store-name" id="store-name"></div>
      <table class="fee-table" id="fee-table"></table>
      <div class="notes" id="notes" style="display:none"></div>
    </div>
  </div>

  <!-- ── Recordings tab ── -->
  <div id="tab-record" style="display:none">
    <div style="padding: 12px 0 0">
      <div class="record-hint">
        Train the extension once per store — it remembers your steps and auto-navigates next time.
      </div>
      <button id="record-btn" class="primary-btn btn-record" style="margin-top:8px">🔴 Start Recording</button>
    </div>
    <div id="recordings-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
