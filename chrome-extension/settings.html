<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fee Checker — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f11;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #17171f;
      border: 1px solid #1e1e28;
      border-radius: 16px;
      padding: 28px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-size: 18px; font-weight: 700; }

    h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    p  { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 20px; }
    p a { color: #7c6fe0; }

    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f0f11;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #7c6fe0; }

    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .show-btn {
      background: none; border: 1px solid #2a2a35; border-radius: 8px;
      color: #666; font-size: 12px; padding: 6px 10px; cursor: pointer;
      white-space: nowrap;
    }
    .show-btn:hover { color: #aaa; border-color: #444; }

    .save-btn {
      margin-top: 20px;
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .save-btn:hover { opacity: 0.88; }

    #status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: #4caf82;
    }
    #status.error { color: #f08080; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">💸</div>
      <span class="logo-text">Fee Checker</span>
    </div>

    <h2>Gemini API Key</h2>
    <p>
      Get a free key at
      <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>.
      Your key is stored locally in Chrome and never sent anywhere except Google's API.
    </p>

    <label for="api-key">API Key</label>
    <div class="row">
      <input type="password" id="api-key" placeholder="AIza…" autocomplete="off" />
      <button class="show-btn" id="toggle-vis">Show</button>
    </div>

    <button class="save-btn" id="save-btn">Save</button>
    <div id="status"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
